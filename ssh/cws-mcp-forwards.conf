# MCP OAuth callbacks listen inside the Cloud Workspace (Cursor MainThread).
# After Atlassian/Slack consent, the laptop browser hits localhost on these
# ports, so every cws.* SSH session must tunnel them. OpenSSH merges these
# with the more specific Host blocks that the Desktop App writes.
#
# Do not put this in a repo devcontainer.json — that is project-specific.
# Laptop bootstrap Includes this file from ~/.ssh/config.

Host cws.*
  LocalForward 127.0.0.1:8787 127.0.0.1:8787
  LocalForward 127.0.0.1:3118 127.0.0.1:3118
