# MCP OAuth callbacks listen inside the Cloud Workspace (Cursor MainThread).
# After Slack consent, the laptop browser hits localhost on these ports, so
# every cws.* SSH session must tunnel them. OpenSSH merges these with the
# more specific Host blocks that the Desktop App writes.
# Atlassian (8787) forwarding is disabled — Cursor handles that callback locally.
#
# Bind both IPv4 and IPv6. Chrome resolves `localhost` to ::1 first; an
# IPv4-only forward leaves ::1 to a local Cursor extension-host, which
# RSTs the Atlassian/Slack callback (ERR_CONNECTION_RESET).
#
# Do not put this in a repo devcontainer.json — that is project-specific.
# Laptop bootstrap Includes this file from ~/.ssh/config.

Host cws.*
  LocalForward 127.0.0.1:3118 127.0.0.1:3118
  LocalForward [::1]:3118 127.0.0.1:3118
  LocalForward 127.0.0.1:19432 127.0.0.1:19432
  LocalForward [::1]:19432 127.0.0.1:19432
