onboarding = false
# Herdr keybindings aligned with the Neovim workflow in this repo.

[keys]
prefix = "ctrl+a"

help = "prefix+?"
settings = "prefix+shift+s"
detach = ["prefix+d", "alt+shift+e"]
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"

workspace_picker = ["prefix+s", "alt+p"]
goto = "prefix+g"
# Navigate-mode bindings used by the workspace picker: j/k select workspaces;
# h/l retain their directional pane-navigation meaning.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# Tilish-style workspace layer: Alt selects/navigates; Alt+Shift mutates.
new_workspace = ["prefix+ctrl+c", "alt+shift+n"]
new_worktree = "alt+shift+g"
rename_workspace = ["prefix+$", "alt+shift+w"]
close_workspace = "alt+shift+d"
previous_workspace = ["prefix+(", "alt+["]
next_workspace = ["prefix+)", "alt+]"]
# Option+Cmd+1..9 switches workspaces directly (Option+1..9 stays on tabs).
# Note: cmd/super chords depend on terminal support (Ghostty passes unbound ones through).
switch_workspace = ["prefix+shift+1..9", "cmd+alt+1..9"]

new_tab = "prefix+c"
rename_tab = ["prefix+comma", "alt+n"]
previous_tab = ["prefix+p", "prefix+ctrl+h"]
next_tab = ["prefix+n", "prefix+ctrl+l"]
# Herdr switches existing tabs only; unlike tilish, missing indices are not created.
switch_tab = ["prefix+1..9", "alt+1..9"]
close_tab = "prefix+ampersand"

edit_scrollback = "prefix+e"
copy_mode = ["prefix+[", "prefix+enter"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = ["prefix+o", "alt+o"]
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+semicolon"
swap_pane_left = ["prefix+shift+h", "alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "alt+shift+l"]
split_vertical = ["prefix+v", "prefix+shift+minus"]
split_horizontal = ["prefix+minus", "alt+enter"]
close_pane = ["prefix+x", "alt+shift+q"]
zoom = ["prefix+z", "prefix+plus", "alt+z"]
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"
previous_agent = "alt+shift+["
next_agent = "alt+shift+]"
focus_agent = "prefix+alt+1..9"

# Fast Alt+hjkl nav via herdr-nvim-nav (C socket action). herdr-splits' bash
# nav scripts fork the herdr CLI several times per keypress (~300ms); this is ~10ms.
# These are plugin_actions: herdr --remote does not send them unless you pass
# --remote-keybindings server (zshrc wraps herdr to do that automatically).
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left across Neovim and Herdr panes"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down across Neovim and Herdr panes"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up across Neovim and Herdr panes"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right across Neovim and Herdr panes"

# Ctrl+hjkl resize still uses herdr-splits (less latency-sensitive).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right across Neovim and Herdr panes"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "dleen.herdr-agents.open"
description = "pick an agent"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "open visible URL"

# Annotate. Folder: prefix then f (or keep holding Ctrl and press p).
# Comment: prefix then u. Ctrl+U is line-kill in the shell if prefix is missed.
# Shift+letter is just a capital letter; prefix+shift+p is Herdr's rename_pane.
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selected terminal text"

[[keys.command]]
key = "prefix+ctrl+u"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selected terminal text"

[[keys.command]]
key = "prefix+ctrl+e"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "annotate.open"
description = "review this folder, or the Markdown file matching the selection"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "annotate.open"
description = "review this folder, or the Markdown file matching the selection"

[[keys.command]]
key = "prefix+ctrl+y"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

# Herdr Mirror: one local Herdr for local + remote CWS workspaces.
# Native prefix+shift+s stays Settings; pause is CLI `herdr-mirror pause`.
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "mirror.start"
description = "start or resume Herdr Mirror"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "mirror.restore"
description = "restore locally closed Herdr Mirror workspaces"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "mirror.new-workspace-pick"
description = "new workspace on this machine or a mirrored host"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "mirror.remote-new-workspace"
description = "new workspace on the remote Herdr host"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "mirror.remote-new-tab"
description = "new tab on the remote host when inside a mirror"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "mirror.remote-split-right"
description = "split the mirrored remote pane right"

[[keys.command]]
key = "prefix+alt+minus"
type = "plugin_action"
command = "mirror.remote-split-down"
description = "split the mirrored remote pane down"

[theme]
name = "tokyo-night"
auto_switch = false

# Kitty graphics still available for other plugins. herdr-pane-minimap draws
# in the Spaces sidebar via workspace metadata tokens ($minimap*).
# Plugin is linked from ~/.dotfiles/herdr/pane-minimap; the watcher starts on
# server restore. After a live `plugin link`, run that plugin's startup.sh once
# (or restart the Herdr server) so the map appears without a reboot.
[experimental]
kitty_graphics = true

# Extra Spaces rows for the pane layout map. Empty $minimap* tokens hide, so
# only the focused workspace grows when the tab has two or more panes.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$minimap_title", dim = true, fg = "#565f89" }],
  [{ token = "$minimap0", fg = "#a9b1d6" }],
  [{ token = "$minimap1", fg = "#a9b1d6" }],
  [{ token = "$minimap2", fg = "#a9b1d6" }],
  [{ token = "$minimap3", fg = "#a9b1d6" }],
  [{ token = "$minimap4", fg = "#a9b1d6" }],
  [{ token = "$minimap5", fg = "#a9b1d6" }],
]

# Share the laptop's OpenSSH ControlMaster (IDDA / `ssh cws.*`) so CWS
# LocalForward and RemoteForward apply. Herdr's default private control
# socket is created by a remote command, and OpenSSH then sets
# ClearAllForwardings — the tunnels from `prd.cws.*.conf` never come up.
[remote]
manage_ssh_config = false

[ui]
agent_panel_sort = "spaces"
# tmux-style splits: one shared divider line between panes, not a gap + double box.
pane_gaps = false
pane_outer_borders = false
# Agent titles are long sentences; the default 36-column ceiling truncates them.
sidebar_width = 44
sidebar_max_width = 60
# Keep mouse selection so annotate.capture can read it. Default true copies
# then clears, and the plugin's pbpaste from the Herdr server is often empty.
copy_on_select = false

# Agent panel rows. The default (workspace + tab, then agent) makes every
# session in a workspace look identical. terminal_title_stripped is the
# agent's own summary of the conversation, which is what distinguishes them.
[ui.sidebar.agents]
# Title first so sessions stay distinguishable. Workspace is still on the
# second row even with agent_panel_sort = "spaces": group headers are easy
# to miss, and the workspace name is what the grouping actually means.
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#a9b1d6" }],
  [{ token = "workspace", dim = true }, { token = "agent", dim = true }],
]
