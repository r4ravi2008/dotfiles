onboarding = false
# Herdr keybindings aligned with the tmux + Neovim workflow in this repo.

[keys]
prefix = "ctrl+a"

help = "prefix+?"
settings = "prefix+shift+s"
detach = ["prefix+d", "alt+shift+e"]
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"

workspace_picker = "prefix+s"
goto = "prefix+g"
new_workspace = "prefix+ctrl+c"
rename_workspace = "prefix+$"
previous_workspace = "prefix+("
next_workspace = "prefix+)"

new_tab = "prefix+c"
rename_tab = ["prefix+comma", "alt+n"]
previous_tab = ["prefix+p", "prefix+ctrl+h"]
next_tab = ["prefix+n", "prefix+ctrl+l"]
# Herdr switches existing tabs only; unlike tilish, missing indices are not created.
switch_tab = ["prefix+1..9", "alt+1..9"]
close_tab = "prefix+ampersand"

edit_scrollback = "prefix+e"
copy_mode = ["prefix+[", "prefix+enter"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = ["prefix+o", "alt+o"]
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+semicolon"
swap_pane_left = ["prefix+shift+h", "alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "alt+shift+l"]
split_vertical = ["prefix+v", "prefix+shift+minus"]
split_horizontal = ["prefix+minus", "alt+enter"]
close_pane = ["prefix+x", "alt+shift+q"]
zoom = ["prefix+z", "prefix+plus", "alt+z"]
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"

# Fast Alt+hjkl nav via herdr-nvim-nav (C socket action). herdr-splits' bash
# nav scripts fork the herdr CLI several times per keypress (~300ms); this is ~10ms.
# These are plugin_actions: herdr --remote does not send them unless you pass
# --remote-keybindings server (zshrc wraps herdr to do that automatically).
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left across Neovim and Herdr panes"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down across Neovim and Herdr panes"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up across Neovim and Herdr panes"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right across Neovim and Herdr panes"

# Ctrl+hjkl resize still uses herdr-splits (less latency-sensitive).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right across Neovim and Herdr panes"

[theme]
name = "tokyo-night"
auto_switch = false
